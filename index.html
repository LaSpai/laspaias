<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lazaros Spaias — Photography</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="hero">
    <div class="hero-top">
      <div class="hero-name">Lazaros Spaias</div>
      <div class="hero-title">Portfolio</div>
    </div>
    <div class="hero-icons">
      <a href="youarenotalone.html" aria-label="You Are Not Alone"><img src="images/cover/jump_stencil.png" alt="You Are Not Alone"></a>
      <a href="showup.html" aria-label="Show Up"><img src="images/cover/mohawk_stencil.png" alt="Show Up"></a>
      <a id="email-icon-hero" href="mailto:spaiklazaros@gmail.com" aria-label="Email"><img src="images/cover/seagull_stencil.png" alt="Email"></a>
      <a href="https://www.instagram.com/laz__street.snaps/" target="_blank" rel="noopener" aria-label="Instagram"><img src="images/cover/cross_stencil.png" alt="Instagram"></a>
      <a href="about.html" aria-label="About"><img src="images/cover/portrait_head.png" alt="About"></a>
    </div>
  </div>

  <footer>© 2026 Lazaros Spaias. All rights reserved.</footer>
  <script src="js/protect.js"></script>
  <script>
    const emailIcon = document.getElementById('email-icon-hero');
    if (emailIcon) {
      emailIcon.addEventListener('click', (e) => {
        e.preventDefault();
        navigator.clipboard.writeText('spaiklazaros@gmail.com').then(() => {
          emailIcon.setAttribute('title', 'Copied!');
          setTimeout(() => emailIcon.removeAttribute('title'), 1500);
        }).catch(() => { window.location.href = 'mailto:spaiklazaros@gmail.com'; });
      });
    }
  </script>

</body>
</html>
