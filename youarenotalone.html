<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You Are Not Alone — Lazaros Spaias</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .showup-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 36px;
      text-align: center;
    }
    .showup-header a img {
      height: 120px;
      width: auto;
      display: block;
      opacity: 0.9;
      transition: opacity 0.2s;
    }
    .showup-header a:hover img { opacity: 1; }
    .showup-quote {
      margin-top: 22px;
      max-width: 520px;
      font-family: 'Special Elite', Georgia, serif;
      font-size: clamp(0.75rem, 2vw, 1rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      line-height: 1.8;
      color: #e8e8e8;
      font-style: italic;
    }
    .showup-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
      padding: 0;
    }
    .showup-grid .gallery-item {
      aspect-ratio: 3/2;
      overflow: hidden;
      cursor: pointer;
    }
    .showup-grid .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s;
    }
    .showup-grid .gallery-item:hover img { opacity: 0.75; }
    @media (max-width: 900px) { .showup-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 600px) { .showup-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

  <div class="showup-header">

  </div>
